name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract variant from tag
        id: extract_variant
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-t1" ]]; then
            echo "VARIANT=t1" >> $GITHUB_OUTPUT
            echo "VARIANT_LABEL=T1" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-t2" ]]; then
            echo "VARIANT=t2" >> $GITHUB_OUTPUT
            echo "VARIANT_LABEL=T2" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Tag must end with -t1 or -t2"
            exit 1
          fi

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          VARIANT_LABEL: ${{ steps.extract_variant.outputs.VARIANT_LABEL }}
        with:
          script: |
            const version = process.env.VERSION;
            const variantLabel = process.env.VARIANT_LABEL;

            const body = [
              `## 🚀 Nueva versión v${version}`,
              ``,
              `> ⚠️ **Dashboard en fase beta** — Algunas secciones aún están en desarrollo.`,
              ``,
              `---`,
              ``,
              `## ✨ Novedades`,
              ``,
              `### 📊 Reporte de Kardex *(nuevo)*`,
              `Reporte detallado de movimientos de inventario por producto, accesible desde [/dashboard/kardex-report](/dashboard/kardex-report).`,
              ``,
              `**Vista Tabla**`,
              `![Kardex - Vista Tabla](https://i.ibb.co/84KH83Xt/Captura-desde-2026-03-02-07-05-09.png)`,
              ``,
              `- Columnas: fecha, tipo de transacción, N° transacción, proveedor/cliente, cantidad, costo unitario, entrada total, precio unitario, salida total y saldo`,
              `- Fila de totales al pie: cantidad total, total entradas, total salidas y saldo final`,
              `- Ordenamiento, redimensionado y persistencia de columnas por usuario`,
              ``,
              `**Vista Gráficos**`,
              `![Kardex - Vista Gráficos](https://i.ibb.co/zhPjr8fB/Captura-desde-2026-03-02-07-05-28.png)`,
              ``,
              `- 📈 Evolución del saldo a lo largo del tiempo`,
              `- 🔄 Comparativa de entradas vs salidas en Bs`,
              `- Control deslizante para limitar registros visualizados (máx. 100)`,
              ``,
              `---`,
              ``,
              `### 🛒 Compras — Detalle de ítems`,
              `Se agregaron dos nuevas columnas en la tabla de ítems al **crear y editar** una compra:`,
              ``,
              `- 🌍 **Procedencia** — origen del producto`,
              `- 🏷️ **Marca** — marca del producto`,
              ``,
              `---`,
              ``,
              `## 🐛 Errores corregidos`,
              ``,
              `<details><summary>Ver lista completa de correcciones</summary>`,
              `<ul>`,
              `  <li><input type="checkbox" checked> Crasheo al renderizar la tabla de detalles de compra cuando propiedades como marca o procedencia eran objetos en lugar de strings</li>`,
              `  <li><input type="checkbox" checked> Validación del campo stock mínimo permitía enviar el formulario con valores incorrectos</li>`,
              `</ul>`,
              `</details>`,
              ``,
              `---`,
              ``,
              `### 📦 Instalación`,
              ``,
              `- **Windows MSI**: \`TPS-Intermotors_${version}_x64_en-US.msi\``,
              `- **Windows NSIS**: \`TPS-Intermotors_${version}_x64-setup.exe\``,
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `TPS Intermotors v${version} [${variantLabel}]`,
              body: body,
              draft: false,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libwebp-dev \
            wget \
            file \
            rpm \
            rpm2cpio

          # Instalar linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract variant from tag
        id: extract_variant
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-t1" ]]; then
            echo "VARIANT=t1" >> $GITHUB_OUTPUT
            echo "VARIANT_LABEL=T1" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-t2" ]]; then
            echo "VARIANT=t2" >> $GITHUB_OUTPUT
            echo "VARIANT_LABEL=T2" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Tag must end with -t1 or -t2"
            exit 1
          fi

      - name: Update Tauri updater endpoint
        shell: bash
        run: |
          VARIANT="${{ steps.extract_variant.outputs.VARIANT }}"
          sed -i 's|latest-t[12]\.json|latest-'"${VARIANT}"'.json|g' src-tauri/tauri.conf.json
          sed -i 's|/latest\.json|/latest-'"${VARIANT}"'.json|g' src-tauri/tauri.conf.json
          echo "Updated updater endpoint to: latest-${VARIANT}.json"
          grep -A 5 '"updater"' src-tauri/tauri.conf.json || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_API_URL_T1 || secrets.VITE_API_URL_T2 }}
          VITE_APP_URL: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_APP_URL_T1 || secrets.VITE_APP_URL_T2 }}
          VITE_WS_URL: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_WS_URL_T1 || secrets.VITE_WS_URL_T2 }}
          VITE_SOCKET_KEY: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_SOCKET_KEY_T1 || secrets.VITE_SOCKET_KEY_T2 }}
          VITE_REVERB_HOST: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_REVERB_HOST_T1 || secrets.VITE_REVERB_HOST_T2 }}
          VITE_REVERB_PORT: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_REVERB_PORT_T1 || secrets.VITE_REVERB_PORT_T2 }}
          VITE_REVERB_APP_KEY: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_REVERB_APP_KEY_T1 || secrets.VITE_REVERB_APP_KEY_T2 }}
          VITE_REVERB_SCHEME: ${{ steps.extract_variant.outputs.VARIANT == 't1' && secrets.VITE_REVERB_SCHEME_T1 || secrets.VITE_REVERB_SCHEME_T2 }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_APP_VARIANT: ${{ steps.extract_variant.outputs.VARIANT }}
          BRANCH_STORAGE_KEY: ${{ vars.BRANCH_STORAGE_KEY || 'selectedBranchId' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "TPS Intermotors __VERSION__"
          releaseBody: "Ver release notes arriba"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

  generate-update-manifest:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract variant from tag
        id: extract_variant
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-t1" ]]; then
            echo "VARIANT=t1" >> $GITHUB_OUTPUT
            echo "VARIANT_LABEL=T1" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-t2" ]]; then
            echo "VARIANT=t2" >> $GITHUB_OUTPUT
            echo "VARIANT_LABEL=T2" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Tag must end with -t1 or -t2"
            exit 1
          fi

      - name: Download and process release assets
        id: get_assets
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });

            const assets = release.data.assets;
            const msiAsset = assets.find(a => a.name.endsWith('.msi') && !a.name.endsWith('.sig'));
            const msiSigAsset = assets.find(a => a.name.endsWith('.msi.sig'));
            const appImageAsset = assets.find(a => a.name.endsWith('.AppImage') && !a.name.endsWith('.sig'));
            const appImageSigAsset = assets.find(a => a.name.endsWith('.AppImage.sig'));
            const rpmAsset = assets.find(a => a.name.endsWith('.rpm') && !a.name.endsWith('.sig'));
            const rpmSigAsset = assets.find(a => a.name.endsWith('.rpm.sig'));

            let result = {
              msiUrl: msiAsset?.browser_download_url || null,
              msiSig: null,
              appImageUrl: appImageAsset?.browser_download_url || null,
              appImageSig: null,
              rpmUrl: rpmAsset?.browser_download_url || null,
              rpmSig: null
            };

            if (msiSigAsset) {
              try {
                const msiSigResponse = await fetch(msiSigAsset.browser_download_url);
                result.msiSig = await msiSigResponse.text();
              } catch (e) {
                console.log('No MSI signature found');
              }
            }

            if (appImageSigAsset) {
              try {
                const appImageSigResponse = await fetch(appImageSigAsset.browser_download_url);
                result.appImageSig = await appImageSigResponse.text();
              } catch (e) {
                console.log('No AppImage signature found');
              }
            }

            if (rpmSigAsset) {
              const rpmSigResponse = await fetch(rpmSigAsset.browser_download_url);
              result.rpmSig = await rpmSigResponse.text();
            }

            return result;

      - name: Generate latest.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const assets = ${{ steps.get_assets.outputs.result }};

            // Obtener el body del release desde GitHub
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });

            const manifest = {
              version: "v${{ steps.get_version.outputs.VERSION }}",
              notes: release.data.body || "Ver changelog completo en GitHub Releases",
              pub_date: new Date().toISOString(),
              platforms: {}
            };

            if (assets.msiUrl && assets.msiSig) {
              manifest.platforms["windows-x86_64"] = {
                url: assets.msiUrl,
                signature: assets.msiSig
              };
            }

            if (assets.appImageUrl && assets.appImageSig) {
              manifest.platforms["linux-x86_64"] = {
                url: assets.appImageUrl,
                signature: assets.appImageSig
              };
            }

            if (assets.rpmUrl && assets.rpmSig) {
              manifest.platforms["linux-rpm-x86_64"] = {
                url: assets.rpmUrl,
                signature: assets.rpmSig
              };
            }

            const variant = '${{ steps.extract_variant.outputs.VARIANT }}';
            const filename = `latest-${variant}.json`;

            fs.writeFileSync(filename, JSON.stringify(manifest, null, 2));
            console.log(`Generated ${filename}:`);
            console.log(fs.readFileSync(filename, 'utf8'));

      - name: Fetch latest JSON from other variant
        id: fetch_other_variant
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const variant = '${{ steps.extract_variant.outputs.VARIANT }}';
            const otherVariant = variant === 't1' ? 't2' : 't1';

            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });

              const otherVariantRelease = releases.data.find(r => r.tag_name.endsWith(`-${otherVariant}`));

              if (otherVariantRelease) {
                console.log(`Found other variant release: ${otherVariantRelease.tag_name}`);

                const asset = otherVariantRelease.assets.find(a => a.name === `latest-${otherVariant}.json`);

                if (asset) {
                  console.log(`Found asset: ${asset.name}`);
                  const response = await fetch(asset.browser_download_url);
                  const content = await response.text();

                  return {
                    found: true,
                    content: content,
                    variant: otherVariant
                  };
                }
              }
            } catch (e) {
              console.log('Could not fetch other variant JSON:', e.message);
            }

            return { found: false };

      - name: Upload all variant JSON files to release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const variant = '${{ steps.extract_variant.outputs.VARIANT }}';
            const currentFilename = `latest-${variant}.json`;

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });

            // 1. Upload current variant file
            console.log(`Uploading ${currentFilename}...`);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: currentFilename,
              data: fs.readFileSync(currentFilename)
            });

            // 2. Upload other variant file if found
            const otherVariantData = ${{ steps.fetch_other_variant.outputs.result || '{"found":false}' }};

            if (otherVariantData.found) {
              const otherFilename = `latest-${otherVariantData.variant}.json`;
              console.log(`Uploading ${otherFilename} from previous release...`);

              fs.writeFileSync(otherFilename, otherVariantData.content);

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: otherFilename,
                data: fs.readFileSync(otherFilename)
              });
            } else {
              console.log('Other variant JSON not found, skipping...');
            }

            // 3. Upload latest.json for backward compatibility
            console.log('Uploading latest.json for backward compatibility...');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'latest.json',
              data: fs.readFileSync(currentFilename)
            });
