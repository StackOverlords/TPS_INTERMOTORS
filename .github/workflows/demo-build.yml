name: Demo Build (Windows)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API URL (ej: https://demo-api.example.com)"
        required: true
        type: string
      reverb_host:
        description: "Reverb Host (opcional)"
        required: false
        type: string
      reverb_port:
        description: "Reverb Port"
        required: false
        default: "443"
        type: string
      reverb_scheme:
        description: "Reverb Scheme (http/https)"
        required: false
        default: "https"
        type: string

permissions:
  contents: read

jobs:
  build-demo-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Disable updater for demo build
        shell: bash
        run: |
          # Desactivar el actualizador para builds de demo
          sed -i 's/"createUpdaterArtifacts": true/"createUpdaterArtifacts": false/g' src-tauri/tauri.conf.json

          # Cambiar el nombre del producto para distinguirlo
          sed -i 's/"productName": "Intermotors"/"productName": "Intermotors-Demo"/g' src-tauri/tauri.conf.json

          # Cambiar el identificador para que no entre en conflicto
          sed -i 's/"identifier": "com.intermotors.tps"/"identifier": "com.intermotors.tps.demo"/g' src-tauri/tauri.conf.json

          echo "Tauri config updated for demo build:"
          grep -E '"productName"|"identifier"|"createUpdaterArtifacts"' src-tauri/tauri.conf.json

      - name: Build Tauri app
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url }}
          VITE_REVERB_HOST: ${{ github.event.inputs.reverb_host || '' }}
          VITE_REVERB_PORT: ${{ github.event.inputs.reverb_port }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY_T1 }}
          VITE_REVERB_SCHEME: ${{ github.event.inputs.reverb_scheme }}
          VITE_APP_ENV: "demo"
          VITE_APP_VARIANT: "demo"
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: demo-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
